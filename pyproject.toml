[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CryoAlpha"
version = "0.1.0"
description = "Cryo-EM map-guided diffusion sampling for AlphaFold 3 (v3.0.4), without retraining"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Mark Schuttelaars"}]
requires-python = ">=3.12"
# AlphaFold 3 v3.0.4 itself (with jax, haiku, absl, numpy) must be installed separately: see README.
dependencies = [
    "mrcfile>=1.5",
    "scipy",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["cryoalpha*"]

[tool.setuptools.package-data]
"cryoalpha.guiding" = ["configs/*.yaml"]
